name: PanLayer background jobs

on:
  schedule:
    # One low-frequency recovery tick runs every day, including weekends. The
    # server decides which incomplete job is due, so completed work is a no-op.
    # Minute 17 avoids GitHub's congested start-of-hour window.
    - cron: "17 * * * *"
    # Extra market checkpoints preserve the six intraday snapshots and the
    # pre-market/close deadlines without returning to five-minute polling.
    - cron: "52 22 * * *" # 06:52 Beijing: tier-1 RSS, including weekends
    - cron: "57 22 * * *" # 06:57 Beijing: tier-2 news, including weekends
    - cron: "27 1 * * 1-5"  # 09:27 Beijing: 09:25 breadth
    - cron: "2 2 * * 1-5"   # 10:02 Beijing: 10:00 breadth
    - cron: "2 3 * * 1-5"   # 11:02 Beijing: 11:00 breadth
    - cron: "2 5 * * 1-5"   # 13:02 Beijing: 13:00 breadth
    - cron: "2 6 * * 1-5"   # 14:02 Beijing: 14:00 breadth
    - cron: "2 7 * * 1-5"   # 15:02 Beijing: 15:00 breadth
    - cron: "32 7 * * 1-5"  # 15:32 Beijing: ETF metrics
    - cron: "12 8 * * 1-5"  # 16:12 Beijing: close review
  workflow_dispatch:
    inputs:
      action:
        description: Background action to run
        required: true
        default: tick
        type: choice
        options:
          - tick
          - regenerate-morning-brief
      scheduled_time:
        description: Optional Unix milliseconds used only for protected catch-up runs
        required: false
        type: string

concurrency:
  group: panlayer-background
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the current scheduled task
        env:
          PANLAYER_CRON_SECRET: ${{ secrets.PANLAYER_CRON_SECRET }}
          PANLAYER_ACTION: ${{ inputs.action || 'tick' }}
          PANLAYER_SCHEDULED_TIME: ${{ inputs.scheduled_time || '' }}
        run: |
          action_header=()
          scheduled_header=()
          if [ "${PANLAYER_ACTION}" = "regenerate-morning-brief" ]; then
            action_header=(-H "X-PanLayer-Action: regenerate-morning-brief")
          fi
          if [ -n "${PANLAYER_SCHEDULED_TIME}" ]; then
            scheduled_header=(-H "X-PanLayer-Scheduled-Time: ${PANLAYER_SCHEDULED_TIME}")
          fi
          response="$(
            curl --fail-with-body --silent --show-error \
            --max-time 240 \
            --retry 2 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${PANLAYER_CRON_SECRET}" \
            -H "X-PanLayer-Scheduler: github" \
            "${action_header[@]}" \
            "${scheduled_header[@]}" \
            "https://panlayer.online/api/v1/internal/scheduler/tick"
          )"
          printf '%s\n' "$response"
          RESPONSE_JSON="$response" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE_JSON || "{}");
          const critical = Array.isArray(payload.jobs)
            ? payload.jobs.filter((job) => job?.critical)
            : [];
          const incomplete = critical.filter((job) =>
            job?.ok === false || job?.status === "partial" || job?.status === "failed"
          );
          if (incomplete.length > 0) {
            console.error(`Critical PanLayer jobs incomplete: ${incomplete.map((job) => `${job.job}:${job.status}`).join(", ")}`);
            process.exit(1);
          }
          NODE
