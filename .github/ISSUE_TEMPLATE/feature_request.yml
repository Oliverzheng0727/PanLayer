name: Feature request
description: Propose a focused improvement to PanLayer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the observable result rather than implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing workflow or simpler option did you consider?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and data-source impact
      description: Note affected pages, APIs, data sources, licensing, or scheduled tasks.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Project fit
      options:
        - label: This request does not introduce investment advice, unlicensed data, secrets, or personal data.
          required: true
